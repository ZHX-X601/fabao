# Alembic 数据库迁移配置
# 注意：数据库连接地址不在此处写死，由 alembic/env.py 从 app 配置（.env）动态读取

[alembic]
# 迁移脚本所在目录
script_location = alembic

# 迁移时自动在 sys.path 前加入项目根目录，保证能 import app 包
prepend_sys_path = .

# 时区相关：渲染 SQL 中的时间戳时使用 UTC
# sqlalchemy.url 留空，由 env.py 运行时填充
sqlalchemy.url =

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
